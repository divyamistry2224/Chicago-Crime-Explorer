<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
<title id="title">Chicago Crime Explorer architecture</title><desc id="desc">City of Chicago data is extracted in Python. Complete city aggregates support interactive reporting and temporal model evaluation. A separate raw-record sample is normalized and audited in SQLite. Versioned static artifacts and tests are deployed through GitHub Actions to a GitHub Pages browser dashboard. A separate Python Plotly Dash application consumes the monthly cube.</desc>
